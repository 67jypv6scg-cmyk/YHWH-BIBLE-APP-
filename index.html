<body>
<noscript><div style="padding:2rem;font:16px system-ui;color:#f3f1ea;background:#0b0c0a">Noble Vine needs JavaScript switched on to open the Bible and study tools.</div></noscript>
<div id="nvSplash" aria-hidden="true"><div class="nvtag">from Noble Vine Restoration Ministries</div></div>
<section id="home" class="hidden" aria-label="Home"></section>
<nav id="tabs" aria-label="Main">
  <button type="button" data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-4.5v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button type="button" data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg>Read</button>
  <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>Plan</button>
  <button type="button" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>Search</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>More</button>
</nav>
<div id="selah" class="hidden" role="dialog" aria-modal="true" aria-label="Selah"></div>
<div id="wordpage" class="hidden" role="dialog" aria-modal="true" aria-label="Today’s Word" tabindex="-1"></div>
<header class="bar">
  <div class="bar-in">
    <button type="button" class="navback" id="navBack" hidden aria-label="Back"><span aria-hidden="true">‹</span><span id="navBackL">Back</span></button>
    <button type="button" class="refbtn" id="refBtn" aria-label="Choose book and chapter">Genesis 1</button>
    <button type="button" class="todaybtn plain" id="todayBtn" aria-label="Reading plan">Plan</button>
    <div class="search">
      <input id="q" type="search" placeholder="Gen 3:15, a word or #theme" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
      <button type="button" class="x hidden" id="qx" aria-label="Clear search">×</button>
    </div>
    <button type="button" class="iconbtn" id="menuBtn" aria-label="Import and settings">☰</button>
  </div>
</header>

<main id="main"><div class="loading" id="loadingState" role="status">Opening your Bible…</div></main>

<div class="selbar hidden" id="selbar" role="toolbar" aria-label="Selected verses">
  <span class="lbl" id="selLbl"></span>
  <button type="button" id="selFav">♥ Favourite</button>
  <button type="button" id="selNote">Note</button>
  <button type="button" id="selCopy">Copy</button>
  <button type="button" id="selMem">Memorise</button>
  <button type="button" id="selCom">Commentary</button>
  <button type="button" id="selRec">Record</button>
  <button type="button" class="q" id="selClear" aria-label="Clear selection">✕</button>
</div>
<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><button type="button" id="sheetBack" class="sheetback" hidden>‹ Back</button><h2 id="sheetTitle"></h2><button type="button" id="sheetClose">Done</button></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// The Spotify dock loads only when "Spotify" is chosen in Settings → Music player
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem('nb-settings') || '{}') || {}; } catch (e) { s = {}; }
  if (s.musicMode !== 'spotify') return;
  var e = document.createElement('script'); e.src = 'spotify-dock.js?v=2.2.0';
  e.onerror = function () { if (window.nvLogError) nvLogError('Could not load the Spotify dock', 'music'); };
  document.body.appendChild(e);
})();
</script>
