<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scriptures, Names Restored</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scriptures">
<meta name="theme-color" content="#0B0D0B">
<style>
@font-face { font-family: 'Lora'; src: url('lora.ttf') format('truetype'); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Lora'; src: url('lora-italic.ttf') format('truetype'); font-weight: 400 700; font-style: italic; font-display: swap; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F7F7F2; --panel: #FFFFFF; --ink: #1F2A22; --soft: #5B665D; --rule: #D9DDD3;
  --accent: #3F5634; --accent-ink: #FFFFFF; --name: #8A6420; --sel: rgba(63,86,52,.13); --hit: rgba(154,116,48,.25);
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --heb: 'Frank Ruhl Libre', 'Times New Roman', 'David', serif;
  --size: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0D0B; --panel: #151915; --ink: #ECEDE6; --soft: #9AA396; --rule: #283026;
    --accent: #A9C596; --accent-ink: #0B0D0B; --name: #E2C27D; --sel: rgba(169,197,150,.16); --hit: rgba(226,194,125,.28);
  }
}
:root[data-theme="dark"] {
  --bg: #0B0D0B; --panel: #151915; --ink: #ECEDE6; --soft: #9AA396; --rule: #283026;
  --accent: #A9C596; --accent-ink: #0B0D0B; --name: #E2C27D; --sel: rgba(169,197,150,.16); --hit: rgba(226,194,125,.28);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4.5rem); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
.bar { transition: transform .25s ease; }
.bar.away { transform: translateY(calc(-100% - env(safe-area-inset-top, 0px))); }
@media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
.bar-in { max-width: 46rem; margin: 0 auto; display: flex; gap: .5rem; align-items: center; padding: .55rem .8rem; }
.refbtn {
  flex: none; background: none; border: 1px solid var(--rule); border-radius: 999px;
  padding: .4rem .85rem; font-weight: 500; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
}
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 999px; padding: .45rem 2rem .45rem .95rem;
}
input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search .x { position: absolute; right: .3rem; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--soft); padding: .3rem .5rem; font-size: 1.1rem; line-height: 1; }
.iconbtn { flex: none; background: none; border: 0; padding: .4rem .45rem; color: var(--soft); font-size: 1.35rem; line-height: 1; border-radius: 8px; }

main { max-width: 46rem; margin: 0 auto; padding: 1.2rem 1.1rem 7rem; }

/* ---------- reading ---------- */
.ch-title { font-weight: 400; font-size: 2rem; margin: .6rem 0 .2rem; letter-spacing: .01em; }
.ch-sub { color: var(--soft); font-size: .85rem; margin: 0 0 1.4rem; }
.text { font-size: var(--size); line-height: 1.85; }
.text p { margin: 0 0 .9em; }
.shead { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 1.6em 0 .5em; font-weight: 600; font-family: var(--serif); }
.v { border-radius: 4px; transition: background-color .25s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.v.sel { background: var(--sel); box-shadow: inset 0 -2px 0 var(--accent); }
.v.flash { background: var(--hit); }
.vn { font-size: .58em; font-weight: 600; color: var(--accent); vertical-align: super; line-height: 0; margin: 0 .18em 0 .1em; font-family: var(--serif); }
.nm { color: var(--name); }
.heb { font-family: var(--heb); font-size: 1.1em; font-weight: 500; unicode-bidi: isolate; }
.chnav { display: flex; justify-content: space-between; gap: .8rem; margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.chnav button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .9rem; color: var(--ink); }
.chnav button[disabled] { opacity: .35; cursor: default; }

.empty { text-align: center; padding: 3rem .5rem; }
.empty .mark { font-family: var(--heb); font-size: 4rem; color: var(--name); line-height: 1; direction: rtl; }
.empty h2 { font-weight: 400; font-size: 1.6rem; margin: 1rem 0 .4rem; }
.empty p { color: var(--soft); margin: 0 auto 1.4rem; max-width: 28rem; }
.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: .65rem 1.2rem; font-weight: 500; }
.quiet { background: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: .65rem 1.2rem; }

/* ---------- search results ---------- */
.res-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin: .2rem 0 1rem; }
.res-head .count { color: var(--soft); font-size: .92rem; }
.scope { display: flex; gap: .35rem; flex-wrap: wrap; }
.chip { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; font-size: .85rem; color: var(--soft); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.goto { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: .7rem .9rem; margin-bottom: 1rem; color: var(--ink); }
.goto b { color: var(--accent); font-weight: 600; }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: .8rem .1rem; color: var(--ink); }
.hit .ref { font-size: .8rem; font-weight: 600; color: var(--accent); letter-spacing: .04em; display: block; margin-bottom: .15rem; }
.hit .t { font-size: 1.02rem; line-height: 1.6; }
mark { background: var(--hit); color: inherit; border-radius: 3px; padding: 0 .08em; }
.more { margin: 1.2rem auto; display: block; }
.hint { color: var(--soft); font-size: .88rem; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--panel); color: var(--ink);
  border-radius: 16px 16px 0 0; max-height: 88%; overflow: auto; overscroll-behavior: contain;
  padding: 0 1.1rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
  max-width: 46rem; margin: 0 auto; border: 1px solid var(--rule); border-bottom: 0;
}
.sheet-head { position: sticky; top: 0; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding: 1rem 0 .7rem; border-bottom: 1px solid var(--rule); margin-bottom: 1rem; z-index: 1; }
.sheet-head h2 { margin: 0; font-weight: 500; font-size: 1.15rem; }
.sheet-head button { background: none; border: 0; color: var(--accent); font-weight: 500; padding: .3rem 0 .3rem .8rem; }
.grp { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin: 1.1rem 0 .5rem; }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .4rem; }
.book { text-align: left; background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .5rem .65rem; color: var(--soft); font-size: .93rem; }
.book.has { color: var(--ink); border-color: var(--accent); }
.book.cur { background: var(--sel); }
.chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: .4rem; }
.chap { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .55rem 0; color: var(--soft); font-variant-numeric: tabular-nums; }
.chap.has { color: var(--ink); border-color: var(--accent); }
.chap.cur { background: var(--accent); color: var(--accent-ink); }
.backlink { background: none; border: 0; color: var(--accent); padding: 0; margin-bottom: .6rem; }

.field { display: block; margin: 0 0 1rem; }
.field > span { display: block; font-size: .85rem; color: var(--soft); margin-bottom: .3rem; }
.field select, .field input, textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .7rem;
}
textarea { min-height: 12rem; resize: vertical; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem; gap: .6rem; }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg button { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: .3rem .85rem; color: var(--ink); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: .6rem; align-items: flex-start; margin: .6rem 0; cursor: pointer; }
.check input { margin-top: .3rem; width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
.set { padding: .2rem 0 1rem; border-bottom: 1px dashed var(--rule); margin-bottom: 1rem; }
.set:last-child { border-bottom: 0; }
.set-t { font-size: .92rem; margin-bottom: .5rem; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .9rem; }
.preview { margin-top: 1rem; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.pv { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem .8rem; border-bottom: 1px solid var(--rule); font-size: .93rem; }
.pv:last-child { border-bottom: 0; }
.pv .warn { color: var(--name); }
.pv .ok { color: var(--accent); }
.status { font-size: .85rem; color: var(--soft); margin: .2rem 0 0; }
.danger { background: none; border: 1px solid var(--name); color: var(--name); border-radius: 8px; padding: .5rem .9rem; }

/* ---------- selection bar and toast ---------- */
.selbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 30;
  display: flex; gap: .4rem; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px;
  padding: .35rem .4rem .35rem 1rem; box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: calc(100% - 2rem);
}
.selbar .lbl { font-size: .9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: .4rem .9rem; font-size: .9rem; white-space: nowrap; }
.selbar button.q { background: none; color: var(--soft); padding: .4rem .6rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: .5rem 1rem; border-radius: 8px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 2rem); text-align: center; }
.toast.show { opacity: 1; }
.todaybtn { flex: none; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 999px; padding: .4rem .8rem; font-weight: 500; font-size: .92rem; white-space: nowrap; }
.todaybtn.plain { background: none; color: var(--accent); }
.planbar { display: flex; align-items: center; gap: .6rem; background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 10px; padding: .55rem .6rem .55rem .85rem; margin: 0 0 1rem; font-size: .9rem; }
.planbar .pb-t { flex: 1; min-width: 0; }
.planbar .pb-t b { font-weight: 600; color: var(--accent); }
.planbar .pb-t span { color: var(--soft); display: block; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.planbar button { background: none; border: 0; color: var(--accent); padding: .3rem .4rem; font-size: .88rem; }
.daychips { display: flex; flex-wrap: wrap; gap: .35rem; margin: -.4rem 0 1.2rem; }
.daychip { border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .6rem; font-size: .8rem; color: var(--soft); background: none; }
.daychip.done { border-color: var(--accent); color: var(--accent); }
.daychip.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.plannav { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: .6rem; }
.plannav .row { display: flex; justify-content: space-between; gap: .8rem; }
.plannav .row button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .9rem; color: var(--ink); }
.plannav .row button[disabled] { opacity: .35; }
.plannav .big { width: 100%; padding: .8rem 1rem; font-size: 1.02rem; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1rem .9rem; margin: 0 0 1rem; }
.card h3 { margin: 0 0 .25rem; font-weight: 500; font-size: 1.1rem; }
.card p { margin: .2rem 0; }
.opt-card { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--rule); border-radius: 12px; padding: .8rem .95rem; margin-bottom: .6rem; color: var(--ink); }
.opt-card b { display: block; font-weight: 500; margin-bottom: .15rem; }
.opt-card span { color: var(--soft); font-size: .88rem; }
.opt-card.on { border-color: var(--accent); background: var(--sel); }
.bigstat { font-size: 1.7rem; font-weight: 400; margin: 0; line-height: 1.2; }
.meter { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; margin: .7rem 0 .4rem; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.15rem, 1fr)); gap: .3rem; }
.day { aspect-ratio: 1; border: 1px solid var(--rule); border-radius: 6px; background: none; color: var(--soft); font-size: .72rem; padding: 0; font-variant-numeric: tabular-nums; }
.day.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.miss { border-color: var(--name); color: var(--name); }
.day.today { box-shadow: 0 0 0 2px var(--ink) inset; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .8rem; color: var(--soft); margin: .6rem 0 0; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 3px; border: 1px solid var(--rule); vertical-align: -1px; margin-right: .3rem; }
.dl-item { display: flex; align-items: center; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--rule); }
.dl-item:last-child { border-bottom: 0; }
.dl-item .nm2 { flex: 1; }
.dl-item .nm2 small { display: block; color: var(--soft); font-size: .78rem; }
.dl-item input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
.dl-item button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .3rem .7rem; color: var(--accent); font-size: .88rem; }
.nmark { display: inline-block; background: none; border: 0; padding: .15em .3em; margin: -.3em 0 -.3em -.1em; color: var(--name); font-size: .75em; vertical-align: .4em; line-height: 1; cursor: pointer; }
.v.noted { text-decoration: underline dotted var(--name); text-underline-offset: .28em; text-decoration-thickness: 1px; }
.quote { border-left: 3px solid var(--accent); padding: .1rem 0 .1rem .8rem; color: var(--soft); font-size: .95rem; line-height: 1.6; margin: 0 0 1rem; max-height: 9.5rem; overflow: auto; }
.nsec { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin: 1.2rem 0 .3rem; }
.loading { text-align: center; color: var(--soft); padding: 4rem 0; }
@media (prefers-reduced-motion: reduce) { .v, .toast { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="refbtn" id="refBtn" aria-label="Choose book and chapter">Genesis 1</button>
    <button class="todaybtn plain" id="todayBtn" aria-label="Reading plan">Plan</button>
    <div class="search">
      <input id="q" type="search" placeholder="Gen 3:15 or a word" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
      <button class="x hidden" id="qx" aria-label="Clear search">×</button>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="Import and settings">☰</button>
  </div>
</header>

<main id="main"><div class="loading">Opening your Bible…</div></main>

<div class="selbar hidden" id="selbar" role="toolbar" aria-label="Selected verses">
  <span class="lbl" id="selLbl"></span>
  <button id="selNote">Note</button>
  <button id="selCopy">Copy</button>
  <button class="q" id="selClear" aria-label="Clear selection">✕</button>
</div>
<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose">Done</button></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

  gn:0, ge:0, bereshit:0, bereshith:0, bereshis:0,
  ex:1, exod:1, shemot:1, shemoth:1,

function normBook(s) {

var qEl = document.getElementById('q'), qx = document.getElementById('qx');
var scope = 'all', shown = 150;
function parseRef(q) {
  var m = q.trim().match(/^((?:[1-3]|i{1,3})?\s*[A-Za-z][A-Za-z .]*?)\s*(\d{1,3})?(?:\s*[:.]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?)?\s*$/i);
  if (!m) return null;
  var b = findBook(m[1]);
  if (b < 0) return null;
  var c = m[2] ? Math.min(+m[2], BOOKS[b][1]) : null;
  var v1 = m[3] ? +m[3] : null, v2 = m[4] ? +m[4] : v1;
  var vs = [];
  if (v1) for (var v = v1; v <= Math.max(v1, v2) && vs.length < 200; v++) vs.push(v);
  return { b: b, c: c, vs: vs, bookOnly: !m[2] };
}
var GROUPS = [['יהוה', 'yahweh', 'yehovah', 'yhwh'], ['יהושע', 'yehoshua', 'yeshua', 'jesus'], ['elohim', 'god']];
function terms(q) {
  var out = [], re = /"([^"]+)"|“([^”]+)”|(\S+)/g, m;

    var t = (m[1] || m[2] || m[3]).toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
    if (!t) continue;
    var alts = [t];
    GROUPS.forEach(function (g) { if (g.indexOf(t) >= 0) alts = g.slice(); });
    out.push(alts);
  }
  return out;
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function termRe(alts) { return new RegExp('(^|[^\\p{L}\\p{N}])(' + alts.map(escRe).join('|') + ')', 'iu'); }
function runSearch(q) {
  var ts = terms(q);
  var res = [];
  if (!ts.length) return res;
  var res_ = ts.map(termRe);
  var keys = Object.keys(chapters).sort();
  keys.forEach(function (k) {
    var d = chapters[k];
    if (scope === 'ot' && d.book >= NT_START) return;
    if (scope === 'nt' && d.book < NT_START) return;
    if (scope === 'book' && d.book !== pos.b) return;
    d.verses.forEach(function (x) {
      for (var i = 0; i < res_.length; i++) if (!res_[i].test(x.t)) return;
      res.push({ b: d.book, c: d.ch, v: x.v, t: x.t });
    });
  });

}
function highlight(t, ts) {
  var h = fmtVerse(t);

  ts.forEach(function (alts) {
    var re = new RegExp('(^|[^\\p{L}\\p{N}])(' + alts.map(function (a) { return escRe(esc(a)); }).join('|') + ')', 'giu');

}
function renderSearch() {
  var q = qEl.value.trim();

  var ref = parseRef(q);
  if (ref && !ref.bookOnly) return; // references open on Enter / Go
  var html = '';
  if (ref && ref.bookOnly) {
    html += '<button class="goto" id="gotoBook">Go to <b>' + esc(BOOKS[ref.b][0]) + '</b></button>';
  }
  if (q.replace(/\s/g, '').length < 2) { main.innerHTML = html + '<p class="hint">Keep typing…</p>'; bindGoto(ref); return; }
  var r = runSearch(q);
  var n = r.list.length;
  var nh = searchNotes(r.ts);
  html += '<div class="res-head"><span class="count">' + (n ? n + (n === 1 ? ' verse' : ' verses') : 'No verses found') + '</span><div class="scope">' +
    [['all', 'All'], ['ot', 'Tanakh'], ['nt', 'New Testament'], ['book', BOOKS[pos.b][0]]].map(function (s) {
      return '<button class="chip' + (scope === s[0] ? ' on' : '') + '" data-scope="' + s[0] + '">' + esc(s[1]) + '</button>';
    }).join('') + '</div></div>';
  if (nh.length) {
    html += '<div class="nsec" style="margin-top:0">Your notes · ' + nh.length + '</div>';
    nh.slice(0, 30).forEach(function (x, i) {
      html += '<button class="hit" data-nh="' + i + '"><span class="ref" style="color:var(--name)">' + esc(x.label) + '</span><span class="t">' + highlight(noteSnippet(x.n.text, 220), r.ts) + '</span></button>';
    });
    html += '<div class="nsec">Bible</div>';
  }
  r.list.slice(0, shown).forEach(function (x, i) {
    html += '<button class="hit" data-i="' + i + '"><span class="ref">' + esc(BOOKS[x.b][0] + ' ' + x.c + ':' + x.v) + '</span><span class="t">' + highlight(x.t, r.ts) + '</span></button>';
  });
  if (n > shown) html += '<button class="quiet more" id="more">Show more (' + (n - shown) + ' left)</button>';
  if (!n && !Object.keys(chapters).length) html += '<p class="hint">Nothing has been imported yet.</p>';
  main.innerHTML = html;
  bindGoto(ref);
  main.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { scope = b.dataset.scope; shown = 150; renderSearch(); }; });
  main.querySelectorAll('.hit[data-i]').forEach(function (b) {
    b.onclick = function () { var x = r.list[+b.dataset.i]; closeSearch(); showChapter(x.b, x.c, [x.v]); };
  });
  main.querySelectorAll('.hit[data-nh]').forEach(function (b) {
    b.onclick = function () { var x = nh[+b.dataset.nh]; if (x.kind === 'v') openNoteEditor(x.n.book, x.n.ch, x.n.v1, x.n.v2, 'search'); else openPlanNote(x.n); };
  });
  var more = document.getElementById('more'); if (more) more.onclick = function () { shown += 150; renderSearch(); };

}

}
function closeSearch() { qEl.value = ''; qx.classList.add('hidden'); qEl.blur(); }
var sT;

(function () {

    '<p>' + (all ? 'You’ve finished the whole plan. Well done.' : b > 0 ? 'You’re ' + b + (b === 1 ? ' day' : ' days') + ' behind. Read on whenever you’re ready.' : nextD > expectedDay() ? 'You’re up to date. The next reading is ' + esc(shortDay(nextD)) + '.' : 'Next up: ' + esc(shortDay(nextD)) + '.') + '</p>' +
    '<div class="actions" style="justify-content:center">' + (!all ? '<button class="primary" id="fNext">Read ' + esc(shortDay(nextD).replace(/ of \d+/, '')) + ' now</button>' : '') +
    '<button class="quiet" id="fTrack">Tracker</button><button class="quiet" id="fFree">Read freely</button></div></div>';
  document.getElementById('refBtn').textContent = 'Books';
  var n = document.getElementById('fNext'); if (n) n.onclick = function () { openPlanDay(nextD); };
  document.getElementById('fTrack').onclick = openTracker;
  document.getElementById('fFree').onclick = function () { showChapter(pos.b, pos.c); };
  window.scrollTo(0, 0);
}

function openPlanSetup() {
  openSheet('Reading plan');
  var imported = Object.keys(chapters).length;
  var choice = imported >= 1189 ? '6m' : 'trial', trialDays = 7, start = todayYmd();
  function render() {
    var t = PLAN_TYPES[choice], days = choice === 'trial' ? trialDays : t.days;
    var sched = buildSchedule(days, t.scope);
    var tmp = { schedule: sched, days: days, passes: t.passes };
    var prevPlan = plan; plan = tmp;
    var pvw = [1, 2, 3].filter(function (d) { return d <= days; }).map(function (d) {
      var l = dayList(d);
      return '<p><b>Day ' + d + ':</b> ' + (l.length ? esc(groupRefs(l)) : '<span class="hint">nothing to read</span>') + '</p>';
    }).join('');
    plan = prevPlan;
    sheetBody.innerHTML =
      '<p class="hint" style="margin-top:0">Each day mixes a Tanakh portion, a reading from Psalms or Proverbs, and a New Testament portion, balanced so every day is about the same length.</p>' +
      opt('6m', 'Whole Bible in 6 months', '182 days · about 6½ chapters a day') +
      opt('3x', 'Whole Bible three times a year', 'Three rounds of 122 days · about 10 chapters a day') +
      opt('trial', 'Trial plan with what’s imported', imported + ' chapters so far · for trying the plan out') +
      (choice === 'trial' ? '<div class="set"><div class="set-t">Trial length</div>' + segBtns('tLen', [[3, '3 days'], [7, '7 days'], [14, '14 days']], trialDays) + '</div>' : '') +
      (choice !== 'trial' && imported < 1189 ? '<p class="hint" style="color:var(--name)">Only ' + imported + ' of 1,189 chapters are imported. The plan will work, but days are balanced more accurately once every book is in.</p>' : '') +
      '<label class="field"><span>Start date</span><input type="date" id="pStart" value="' + start + '"></label>' +
      '<div class="card"><h3>First days</h3>' + pvw + '</div>' +
      '<div class="actions"><button class="primary" id="pGo">Start plan</button></div>';
    sheetBody.querySelectorAll('.opt-card').forEach(function (el) { el.onclick = function () { choice = el.dataset.t; render(); }; });
    var tl = document.getElementById('tLen');
    if (tl) tl.querySelectorAll('button').forEach(function (b) { b.onclick = function () { trialDays = +b.dataset.val; render(); }; });
    document.getElementById('pStart').onchange = function () { if (this.value) start = this.value; };
    document.getElementById('pGo').onclick = function () {
      plan = { type: choice, name: choice === 'trial' ? 'Trial plan (' + days + ' days)' : t.name, days: days, passes: t.passes, scope: t.scope,
        start: start, schedule: sched, done: {}, ticks: {}, pausedFrom: null, created: Date.now() };
      savePlan(true);
      toast('Plan started. Tap Today any time.');
      openPlanDay(firstOpen());
    };
  }
  function opt(id, title, sub) { return '<button class="opt-card' + (choice === id ? ' on' : '') + '" data-t="' + id + '"><b>' + title + '</b><span>' + sub + '</span></button>'; }
  render();
}
function groupRefs(list) {
  var out = [], i = 0;
  while (i < list.length) {
    var j = i;
    while (j + 1 < list.length && list[j + 1].b === list[i].b && list[j + 1].c === list[j].c + 1) j++;
    out.push(bn(list[i].b, j === i) + ' ' + list[i].c + (j > i ? '–' + list[j].c : ''));
    i = j + 1;
  }
  return out.join(' · ');
}
function openTracker() {
  if (!plan) return openPlanSetup();
  openSheet(plan.name);
  var total = totalDays(), done = doneCount(), e = expectedDay(), b = behindCount(), nextD = firstOpen();
  var pct = Math.round(done / total * 100);
  var status = plan.pausedFrom ? 'Paused since ' + niceDate(plan.pausedFrom) + '.' :
    e === 0 ? 'Starts ' + niceDate(plan.start) + '.' :
    b === 0 ? 'You’re on track.' : 'You’re ' + b + (b === 1 ? ' day' : ' days') + ' behind.';
  var h = '<div class="card"><p class="bigstat">' + (nextD ? esc(dayLabel(nextD)) : 'Plan complete') + '</p>' +
    '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
    '<p class="hint" style="margin:0">' + done + ' of ' + total + ' days read (' + pct + '%) · ' + esc(status) + '</p>' +
    '<div class="actions">' + (nextD ? '<button class="primary" id="tRead">Read ' + esc(shortDay(nextD).replace(/ of \d+/, '')) + '</button>' : '') + '</div></div>';
  if (b > 0 && !plan.pausedFrom) {
    h += '<div class="card"><h3>Catching up</h3><p class="hint">Read the missed days at your own pace, or move the plan back so you’re on track again. Your end date moves back by ' + b + (b === 1 ? ' day' : ' days') + '.</p>' +
      '<div class="actions"><button class="quiet" id="tShift">Move the plan back ' + b + (b === 1 ? ' day' : ' days') + '</button></div></div>';
  }
  for (var p = 1; p <= plan.passes; p++) {
    if (plan.passes > 1) h += '<div class="grp">Round ' + p + '</div>'; else h += '<div class="grp">Days</div>';
    h += '<div class="days">';
    for (var k = 1; k <= plan.days; k++) {
      var d = (p - 1) * plan.days + k;
      var cls = isDone(d) ? ' done' : d < e ? ' miss' : '';
      if (d === e && !plan.pausedFrom) cls += ' today';
      h += '<button class="day' + cls + '" data-d="' + d + '" aria-label="' + esc(dayLabel(d)) + '">' + k + '</button>';
    }
    h += '</div>';
  }
  h += '<div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>Read</span><span><i style="border-color:var(--name)"></i>Missed</span><span><i style="box-shadow:0 0 0 2px var(--ink) inset"></i>Today</span></div>';
  var endD = dateOf(total);
  h += '<p class="status" style="margin-top:1rem">Started ' + niceDate(plan.start) + ' · finishes ' + niceDate(endD) + (plan.pausedFrom ? ' (plus the paused days)' : '') + '</p>';
  h += '<div class="actions" style="margin-top:1.2rem"><button class="quiet" id="tPause">' + (plan.pausedFrom ? 'Resume plan' : 'Pause plan') + '</button><button class="danger" id="tEnd">End plan</button></div>';
  sheetBody.innerHTML = h;
  var r = document.getElementById('tRead'); if (r) r.onclick = function () { openPlanDay(nextD); };
  sheetBody.querySelectorAll('.day').forEach(function (el) { el.onclick = function () { openDayDetail(+el.dataset.d); }; });
  var sh = document.getElementById('tShift');
  if (sh) sh.onclick = function () { plan.start = addDays(plan.start, b); savePlan(true); toast('Plan moved back ' + b + (b === 1 ? ' day' : ' days') + '.'); openTracker(); };
  document.getElementById('tPause').onclick = function () {
    if (plan.pausedFrom) { var gap = Math.max(0, dayDiff(plan.pausedFrom, todayYmd())); plan.start = addDays(plan.start, gap); plan.pausedFrom = null; toast('Plan resumed.'); }
    else { plan.pausedFrom = todayYmd(); toast('Plan paused. Days won’t count as missed until you resume.'); }
    savePlan(true); openTracker();
  };
  var en = document.getElementById('tEnd');
  en.onclick = function () {
    if (en.dataset.armed !== '1') { en.dataset.armed = '1'; en.textContent = 'Tap again to end the plan'; return; }
    plan = null; planCtx = null; savePlan(true); closeSheet(); toast('Plan ended. Your Bible and notes are untouched.'); showChapter(pos.b, pos.c);
  };
}
async function openDayDetail(d) {
  openSheet(dayLabel(d));
  var list = dayList(d);
  var h = '<button class="backlink" id="ddBack">‹ Tracker</button><p class="status" style="margin:0 0 .8rem">' + niceDate(dateOf(d)) + (isDone(d) ? ' · read' : '') + '</p>';
  if (!list.length) h += '<p class="hint">Nothing is scheduled for this day. A day to catch up, or to reflect.</p>';
  var lastS = -1;
  list.forEach(function (x, i) {
    if (x.s !== lastS) { h += '<div class="grp">' + esc(STREAMS[x.s].label) + '</div>'; lastS = x.s; }
    h += '<div class="dl-item"><input type="checkbox" data-k="' + x.k + '"' + (ticked(d, x.k) ? ' checked' : '') + ' aria-label="Read ' + esc(bn(x.b) + ' ' + x.c) + '"><span class="nm2">' + esc(bn(x.b) + ' ' + x.c) + (has(x.b, x.c) ? '' : '<small>not imported yet</small>') + '</span><button data-i="' + i + '">Read</button></div>';
  });
  h += '<div class="actions"><button class="' + (isDone(d) ? 'quiet' : 'primary') + '" id="ddDone">' + (isDone(d) ? 'Mark as not read' : 'Mark day as read') + '</button></div>';
  h += '<div class="grp" style="margin-top:1.4rem">My notes for this day</div><textarea id="ddNote" placeholder="What stood out? Thoughts for teaching…" style="min-height:8rem"></textarea><p class="status" id="ddNoteStat"></p>';
  sheetBody.innerHTML = h;
  document.getElementById('ddBack').onclick = openTracker;
  sheetBody.querySelectorAll('.dl-item input').forEach(function (el) {
    el.onchange = function () {
      setTick(d, el.dataset.k, el.checked);
      var all = list.every(function (x) { return ticked(d, x.k); });
      if (all && !isDone(d)) { setDone(d, true); toast(shortDay(d) + ' complete'); }
      if (!el.checked && isDone(d)) setDone(d, false);
      savePlan();
      var btn = document.getElementById('ddDone'); btn.textContent = isDone(d) ? 'Mark as not read' : 'Mark day as read'; btn.className = isDone(d) ? 'quiet' : 'primary';
    };
  });
  sheetBody.querySelectorAll('.dl-item button').forEach(function (el) {
    el.onclick = function () { var i = +el.dataset.i; planCtx = { d: d, list: list, i: i }; closeSheet(); closeSearch(); showChapter(list[i].b, list[i].c); };
  });
  document.getElementById('ddDone').onclick = function () {
    if (isDone(d)) { setDone(d, false); plan.ticks = plan.ticks || {}; list.forEach(function (x) { delete plan.ticks[d + '_' + x.k]; }); }
    else setDone(d, true);
    savePlan(true); openDayDetail(d);
  };
  var ta = document.getElementById('ddNote'), st = document.getElementById('ddNoteStat');
  ta.disabled = true; ta.value = await getNote(d); ta.disabled = false;
  ta.addEventListener('input', function () { st.textContent = 'Saving…'; putNote(d, ta.value, st); });
}

// ======================================================================
// Back up and restore
// ======================================================================
var downloads = null;
function summarise(list) {
  var byBook = {};
  list.forEach(function (c) { (byBook[c.book] = byBook[c.book] || []).push(c.ch); });
  return Object.keys(byBook).map(Number).sort(function (a, z) { return a - z; }).map(function (b) {
    var chs = byBook[b].sort(function (a, z) { return a - z; }), parts = [], st = chs[0], pv = chs[0];
    for (var i = 1; i <= chs.length; i++) {
      if (i < chs.length && chs[i] === pv + 1) { pv = chs[i]; continue; }
      parts.push(st === pv ? st : st + '–' + pv);
      if (i < chs.length) st = pv = chs[i];
    }
    return BOOKS[b][0] + ' ' + parts.join(', ');
  }).join('; ');
}
function openBackup() {
  openSheet('Back up and restore');
  var list = Object.keys(chapters).sort().map(function (k) { return chapters[k]; });
  var verses = list.reduce(function (a, c) { return a + c.verses.length; }, 0);
  sheetBody.innerHTML =
    '<div class="set"><div class="set-t">Export my Bible</div>' +
    '<p class="hint" style="margin-top:0">Saves everything you’ve imported into one backup file' + (list.length ? ': ' + esc(summarise(list)) + ' (' + verses + ' verses)' : '') + ', with your ' + (Object.keys(vnotes).length + Object.keys(pnotes).length) + ' notes and your reading plan. Keep it in Files or iCloud Drive. The installable version of this app will load your Bible from this file.</p>' +
    '<div class="actions"><button class="primary" id="bExport"' + (list.length ? '' : ' disabled') + '>Export my Bible</button></div><p class="status" id="bExStat"></p></div>' +
    '<div class="set"><div class="set-t">Restore from a backup file</div>' +
    '<p class="hint" style="margin-top:0">Adds the chapters from a backup file. Chapters you already have with the same number are replaced; nothing else is removed.</p>' +
    '<input type="file" id="bFile" accept=".json,application/json" class="hidden">' +
    '<div class="actions"><button class="quiet" id="bPick">Choose backup file</button></div><div id="bRes"></div></div>';
  var ex = document.getElementById('bExport'), exStat = document.getElementById('bExStat');
  if (!downloads) { ex.disabled = true; exStat.textContent = 'Saving files isn’t available in this view.'; }
  ex.onclick = async function () {
    var d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var data = JSON.stringify({ app: 'names-restored-bible', format: 1, exported: d.toISOString(), note: 'Personal reading copy. ESV text with the Names restored.', settings: S, plan: plan, verseNotes: Object.keys(vnotes).map(function (k) { return vnotes[k]; }), planNotes: Object.keys(pnotes).map(function (k) { return pnotes[k]; }), chapters: list });
    ex.disabled = true; exStat.style.color = ''; exStat.textContent = 'Preparing the file…';
    try {
      await downloads.save({ filename: 'Names Restored Bible backup ' + stamp + '.json', data: new Blob([data]) });
      exStat.textContent = 'Saved. ' + list.length + ' chapters are in the backup.';
    } catch (e) {
      var c = e && e.code;
      exStat.style.color = c === 'declined' ? '' : 'var(--name)';
      exStat.textContent = c === 'declined' ? 'Cancelled.' : c === 'rate_limited' ? 'A save is already waiting for your answer.' : 'Couldn’t save the file (' + (c || 'error') + ').';
      if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { exStat.textContent = 'Saving files isn’t available in this view.'; return; }
    }
    ex.disabled = false;
  };
  var file = document.getElementById('bFile'), res = document.getElementById('bRes');
  document.getElementById('bPick').onclick = function () { file.value = ''; file.click(); };
  file.onchange = function () {
    var f = file.files && file.files[0]; if (!f) return;
    var r = new FileReader();
    r.onerror = function () { res.innerHTML = '<p class="hint" style="color:var(--name)">That file couldn’t be read.</p>'; };
    r.onload = function () {
      var obj;
      try { obj = JSON.parse(r.result); } catch (e) { obj = null; }
      var items = obj && obj.app === 'names-restored-bible' && Array.isArray(obj.chapters) ? obj.chapters.filter(function (c) {
        return c && typeof c.book === 'number' && c.book >= 0 && c.book < BOOKS.length && typeof c.ch === 'number' && c.ch >= 1 && c.ch <= BOOKS[c.book][1] && Array.isArray(c.verses) && c.verses.length;
      }) : [];
      var vn = obj && Array.isArray(obj.verseNotes) ? obj.verseNotes.filter(function (n) { return n && n.id && typeof n.text === 'string' && n.text.trim(); }) : [];
      var pn = obj && Array.isArray(obj.planNotes) ? obj.planNotes.filter(function (n) { return n && n.id && n.planCreated && typeof n.text === 'string' && n.text.trim(); }) : [];
      if (!items.length && !vn.length && !pn.length) { res.innerHTML = '<p class="hint" style="color:var(--name)">This isn’t a backup from this app, or it has nothing in it.</p>'; return; }
      var replaces = items.filter(function (c) { return has(c.book, c.ch); }).length;
      res.innerHTML = '<p class="hint">This backup has ' + items.length + ' chapters' + (items.length ? ': ' + esc(summarise(items)) : '') + (vn.length + pn.length ? ', and ' + (vn.length + pn.length) + ' notes' : '') + '.' + (replaces ? ' ' + replaces + ' of them will replace chapters you already have.' : '') + '</p>' +
        '<div class="actions"><button class="primary" id="bRestore">Restore</button></div><p class="status" id="bStat"></p>';
      document.getElementById('bRestore').onclick = async function () {
        var btn = this, st = document.getElementById('bStat'); btn.disabled = true;
        try {
          for (var i = 0; i < items.length; i++) {
            var c = items[i];
            st.textContent = 'Restoring ' + BOOKS[c.book][0] + ' ' + c.ch + ' (' + (i + 1) + ' of ' + items.length + ')…';
            await putChapter({ key: key(c.book, c.ch), book: c.book, ch: c.ch,
              verses: c.verses.map(function (x) { return { v: +x.v, t: String(x.t) }; }),
              heads: (c.heads || []).map(function (x) { return { v: +x.v, t: String(x.t) }; }), updated: Date.now() });
          }
          for (var j = 0; j < vn.length + pn.length; j++) {
            var isV = j < vn.length, n = isV ? vn[j] : pn[j - vn.length];
            st.textContent = 'Restoring notes (' + (j + 1) + ' of ' + (vn.length + pn.length) + ')…';
            var clean = JSON.parse(JSON.stringify(n));
            if (store.mode === 'db') await withTimeout((isV ? store.vnotes : store.notes).doc(clean.id).set(clean), 20000);
            (isV ? vnotes : pnotes)[clean.id] = clean;
          }
          if (store.mode !== 'db') { lsSet('nb-vnotes', vnotes); lsSet('nb-pnotes', pnotes); }
          st.textContent = 'Done. ' + items.length + ' chapters' + (vn.length + pn.length ? ' and ' + (vn.length + pn.length) + ' notes' : '') + ' restored.';
          btn.textContent = 'Restored';
          if (!qEl.value.trim() && (items.length || has(pos.b, pos.c))) showChapter(has(pos.b, pos.c) ? pos.b : items[0].book, has(pos.b, pos.c) ? pos.c : items[0].ch);
        } catch (e) {
          btn.disabled = false; st.style.color = 'var(--name)';
          st.textContent = 'Stopped: ' + ((e && e.code) || 'error') + '. Chapters restored so far are kept; tap Restore to finish the rest.';
        }
      };
    };
    r.readAsText(f);
  };
}

// Start
// ======================================================================
(async function start() {
  await idbPreload();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  Object.assign(S, lsGet('nb-settings', {}));
  applyLook();
  await initStore();
  try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch (e) {}
  if (!downloads) downloads = { save: async function (o) {
    var file = new File([o.data], o.filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    var url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  } };
  try { await loadAll(); } catch (e) { toast('Couldn’t load your Bible. Check your connection.'); }
  try { await loadPlan(); } catch (e) {}
  try { await loadNotes(); } catch (e) {}
  applyLook();
  var at = S.last && has(S.last.b, S.last.c) ? S.last : firstLoaded();
  if (at) showChapter(at.b, at.c); else renderEmpty();
})();

window.__nb = { parseImport: parseImport, parseRef: parseRef, runSearch: runSearch, chapters: function () { return chapters; } };
})();
